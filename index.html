<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NumLab</title>
    <script>
      // Set the theme before first paint so there is no light flash in dark mode.
      (function () {
        try {
          var t = window.localStorage.getItem('numlab.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tooltip styles: work in light and dark theme -->
    <style>
      #nl-tooltip {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        max-width: min(18rem, calc(100vw - 16px));
        padding: 6px 10px;
        border-radius: 8px;
        font: 500 12px/1.35 'Inter', ui-sans-serif, system-ui, sans-serif;
        color: #ffffff;
        background: #172554;
        box-shadow: 0 6px 18px -6px rgba(23, 37, 84, 0.45);
        pointer-events: none;
        opacity: 0;
        transform: translateY(2px);
        transition: opacity 120ms ease, transform 120ms ease;
        word-wrap: break-word;
      }
      #nl-tooltip.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      #nl-tooltip::after {
        content: '';
        position: absolute;
        left: var(--arrow-x, 50%);
        width: 8px;
        height: 8px;
        background: inherit;
        transform: translateX(-50%) rotate(45deg);
      }
      #nl-tooltip[data-side='top']::after {
        bottom: -4px;
      }
      #nl-tooltip[data-side='bottom']::after {
        top: -4px;
      }
      :root[data-theme='dark'] #nl-tooltip {
        color: #0b1020;
        background: #e8edff;
        box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.6);
      }
      @media (prefers-reduced-motion: reduce) {
        #nl-tooltip {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="nl-tooltip" role="tooltip" aria-hidden="true"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Tooltip behaviour.
      Usage: add data-tooltip="Your text" to any element.
      Existing title="..." attributes (theme toggle, icon buttons, ...) are
      upgraded to the same styled tooltip automatically.
    -->
    <script>
      (function () {
        var tip = document.getElementById('nl-tooltip');
        var current = null;
        var showTimer = null;
        var GAP = 10;
        var MARGIN = 8;

        function textFor(el) {
          var t = el.getAttribute('data-tooltip');
          if (!t && el.hasAttribute('title')) {
            // Move native title so the browser's own tooltip does not double up.
            t = el.getAttribute('title');
            el.setAttribute('data-tooltip', t);
            el.removeAttribute('title');
          }
          return t;
        }

        function position(el) {
          var r = el.getBoundingClientRect();
          var tw = tip.offsetWidth;
          var th = tip.offsetHeight;
          var side = r.top - th - GAP >= MARGIN ? 'top' : 'bottom';
          var top = side === 'top' ? r.top - th - GAP : r.bottom + GAP;
          var center = r.left + r.width / 2;
          var left = center - tw / 2;
          left = Math.max(MARGIN, Math.min(left, window.innerWidth - tw - MARGIN));
          tip.style.left = left + 'px';
          tip.style.top = top + 'px';
          tip.style.setProperty('--arrow-x', Math.max(12, Math.min(center - left, tw - 12)) + 'px');
          tip.setAttribute('data-side', side);
        }

        function show(el, delay) {
          clearTimeout(showTimer);
          showTimer = setTimeout(function () {
            if (!el.isConnected) return;
            var text = textFor(el);
            if (!text) return;
            current = el;
            tip.textContent = text;
            tip.setAttribute('aria-hidden', 'false');
            position(el);
            tip.classList.add('is-visible');
          }, delay);
        }

        function hide() {
          clearTimeout(showTimer);
          current = null;
          tip.classList.remove('is-visible');
          tip.setAttribute('aria-hidden', 'true');
        }

        function target(e) {
          return e.target && e.target.closest ? e.target.closest('[data-tooltip],[title]') : null;
        }

        document.addEventListener('mouseover', function (e) {
          var el = target(e);
          if (el && el !== current) show(el, 250);
        });
        document.addEventListener('mouseout', function (e) {
          var el = target(e);
          if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hide();
        });
        document.addEventListener('focusin', function (e) {
          var el = target(e);
          if (el) show(el, 0);
        });
        document.addEventListener('focusout', hide);
        document.addEventListener('mousedown', hide);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') hide();
        });
        window.addEventListener('scroll', hide, true);
        window.addEventListener('resize', hide);
      })();
    </script>
  </body>
</html>
